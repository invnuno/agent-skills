name: Validate skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests

      - name: Validate skill packages
        run: python scripts/validate_skills.py

      - name: Check Python syntax
        run: python -m py_compile scripts/validate_skills.py skills/*/scripts/*.py

      - name: Check shell helpers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            bash -n "$script"
            "$script" --help >/dev/null
          done < <(find skills -path '*/scripts/*.sh' -type f -print0)
